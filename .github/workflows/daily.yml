  name: Daily Radar                                                                                                             
                                                                                                                                
  on:                                                                                                                           
    workflow_dispatch:
    schedule:
      - cron: '0 13 * * *'                                                                                                      
                                                                                                                                
  jobs:                                                                                                                         
    run-radar:                                                                                                                  
      runs-on: ubuntu-latest                                                                                                    
      steps:                                                                                                                    
        - name: Check out code                                                                                                  
          uses: actions/checkout@v4                                                                                             
        - name: Set up Python                                                                                                   
          uses: actions/setup-python@v5                                                                                         
          with:                                                                                                                 
            python-version: '3.11'                                                                                              
        - name: Install dependencies                                                                                            
          run: pip install -r requirements.txt                                                                                  
        - name: Run radar                                                                                                       
          env:                                                                                                                  
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_RUN_RADAR }}                                                       
            SUPABASE_URL: ${{ secrets.SUPABASE_URL_RUN_RADAR }}                                                                 
            SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_RUN_RADAR }}                                       
          run: python main.py                                                                                                   
                                                                                                                                
